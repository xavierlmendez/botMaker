# from engineering-standards @ 56bfdb2 (configs/python/ci.yml); local adaptations: TODO grep paths (paths, and the marker widened to `//` in *.html/*.js — back-port to engineering-standards),
# adapted to this repo, and a second job `ci-torch` for the opt-in torch dependency group (D-31) —
# the default `ci` job installs no torch, so the torch tests skip there via pytest.importorskip.
# `ci-torch` runs the whole suite; the five spectral-start fixture tests skip off the platform that
# wrote them (BL-50) and say so in the summary.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install
        run: uv sync --locked --dev
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: TODOs reference the backlog
        run: |
          hits=$(grep -rnE '(#|//)[[:space:]]*TODO' --include='*.py' --include='*.html' --include='*.js' src tests examples | grep -vE '(#|//)[[:space:]]*TODO\(BL-[0-9]+\):' || true)
          if [ -n "$hits" ]; then echo "$hits"; echo "TODO without BL-nn id"; exit 1; fi
      - name: Test
        run: uv run pytest

  ci-torch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install with the torch group
        run: uv sync --locked --dev --group torch
      - name: Test (the whole suite, so every importorskip'd torch test runs somewhere)
        run: uv run pytest -q
