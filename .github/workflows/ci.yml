# from engineering-standards @ 56bfdb2 (configs/python/ci.yml); TODO grep paths adapted to this repo.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install
        run: uv sync --locked --dev
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: TODOs reference the backlog
        run: |
          hits=$(grep -rn '#[[:space:]]*TODO' --include='*.py' MlLib examples | grep -v 'TODO(BL-[0-9][0-9]*):' || true)
          if [ -n "$hits" ]; then echo "$hits"; echo "TODO without BL-nn id"; exit 1; fi
      - name: Test
        run: uv run pytest
