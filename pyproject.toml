# Root project file. Ruff/pytest/dependency-group blocks from engineering-standards @ 869af91
# (configs/python/pyproject.ruff.toml); see sources/SOURCES.md there for the vendor docs behind each key.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mllib"
version = "0.1.0"
description = "From-scratch math and ML library — the BotMaker learning and reference project."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Xavier Mendez" }]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2",
  "scikit-learn>=1.4",     # train_test_split, ParameterGrid only
  "networkx>=3.2",
  "matplotlib>=3.8",       # notebooks/MLFall25HW1.ipynb only; BL-43 slice 4 deleted
                           # math/graph/visualizer.py, the last library importer
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "pre-commit>=3",
  "hypothesis>=6",
]
# torch is a local-only group (D-31): opt in with `uv sync --dev --group torch`. The CPU index is
# explicit so a Linux checkout gets the CPU wheel instead of PyPI's default GPU build.
torch = ["torch>=2.4"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.setuptools.packages.find]
where = ["src"]
include = ["mllib", "mllib.*"]

[tool.setuptools.package-data]
"mllib.visualization" = ["*.html", "*.js"]        # walkthrough template and stepper (D-32)
"mllib.visualization.views" = ["*.js"]            # each problem's drawing function (BL-43 slice 2)

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks"]   # coursework notebooks are not library code

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "TD", "RUF"]
ignore = [
  "TD002",   # author tag not required: the BL-nn id carries provenance
  "TD003",   # issue link not required: BL-nn resolves in docs/BACKLOG.md
]

# The two-hot span modules write the brief's mathematics in the brief's notation. Sigma, lambda and
# mu are already unambiguous to RUF001-003; nu and the script l (the vertex load) are not, and
# spelling them "nu" and "l" beside them would be worse than allowing them here.
allowed-confusables = ["\u03bd", "\u2113"]

[tool.ruff.lint.per-file-ignores]
# Remaining BL-24 lint debt (docs/BACKLOG.md). A code leaves this list when its count reaches zero;
# nothing is added without a backlog entry. Counts at 2026-08-29: E501 x149, F841 x2, B007 x2, E711 x3, B905 x1, E402 x3.
"src/**" = ["E501", "F841", "B007", "E711", "B905", "E402"]
"examples/**" = ["E501", "F841", "B007", "E711", "B905", "E402"]
"tests/**" = ["E402", "RUF059"]

[tool.ruff.lint.pep8-naming]
ignore-names = ["X", "X_*", "Q"]   # ML convention: design matrix and quadratic form

[tool.ruff.lint.isort]
known-first-party = ["mllib"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
