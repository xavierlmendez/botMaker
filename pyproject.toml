# Root project file. Ruff/pytest/dependency-group blocks from engineering-standards @ 869af91
# (configs/python/pyproject.ruff.toml); see sources/SOURCES.md there for the vendor docs behind each key.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mllib"
version = "0.1.0"
description = "From-scratch math and ML library — the BotMaker learning and reference project."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Xavier Mendez" }]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2",
  "scikit-learn>=1.4",     # train_test_split, ParameterGrid only
  "networkx>=3.2",
  "matplotlib>=3.8",       # graphBased/visualizer.py
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "pre-commit>=3",
  "hypothesis>=6",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["mllib", "mllib.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks"]   # coursework notebooks are not library code

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "TD", "RUF"]
ignore = [
  "TD002",   # author tag not required: the BL-nn id carries provenance
  "TD003",   # issue link not required: BL-nn resolves in docs/BACKLOG.md
]

[tool.ruff.lint.per-file-ignores]
# Pre-refactor debt, tracked as BL-24 in docs/BACKLOG.md. Each code is removed from this list by the
# slice that burns it down (Phase 3: E402 F841 RUF059 B007 E711 SIM113 B905 RUF002 RUF012 E501;
# slice 4.3: the N naming rules). Do not add codes here; fix the code or open a backlog entry.
"src/**" = [
  # (examples/** shares this list below)
  "N801", "N802", "N803", "N806", "N815", "N816",   # camelCase classes/methods/vars (D-17, slice 4.3)
  "E501",    # long comment/string lines (130 after format)
  "RUF012",  # mutable class-level metadata dicts — removed by introspection in slice 5.1
  "F841", "RUF059", "B007", "E711", "SIM113", "B905", "E402", "RUF002",   # slice 3.5/3.6 cleanups
]
"tests/**" = ["N802", "N803", "N806", "N816", "B905", "E402", "RUF012", "RUF059", "F841"]  # camelCase test names until 4.3
"examples/**" = [
  "N801", "N802", "N803", "N806", "N815", "N816",   # camelCase classes/methods/vars (D-17, slice 4.3)
  "E501",    # long comment/string lines (130 after format)
  "RUF012",  # mutable class-level metadata dicts — removed by introspection in slice 5.1
  "F841", "RUF059", "B007", "E711", "SIM113", "B905", "E402", "RUF002",   # slice 3.5/3.6 cleanups
]

[tool.ruff.lint.isort]
known-first-party = ["mllib"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
